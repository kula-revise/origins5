/* COLD WAR ORIGINS: zone
   Checked against the identity register before designing. Vietnam holds cream
   paper and a serif on soft rounded cards. USA 1920s holds a near-black deco
   ground with tracked-out uppercase. Black Power holds bone with heavy condensed
   uppercase and offset shadows. Black Consciousness holds manila paper with
   typewriter mono on every label. Angola holds cool slate with mono labels and
   hairline squares. Congo holds Ore Seam's warm radial washes. US Civil Rights
   holds Depot: warm grey, asphalt graphite, rose, enamel sign plates.

   The source course had its own identity, near-black violet with a serif display
   face and a mono, framed as signals intelligence. It is dropped: a dark ground
   collides with USA 1920s and mono labels collide with Angola and Frank Talk.

   The metaphor here is the one thing every source in this unit argues about: a
   line drawn across a map. Not the wall, which is only the last chapter, and not
   spy fiction, which is the identity being replaced. So: the diagonal hatch a
   1940s atlas uses to mark an occupied or disputed zone, a border red for
   structure, and a steel blue for anything the learner earned.

   Signature moves, each chosen because nothing else on the register uses it:
     - cards bounded on two sides only, top and left, so they read as territory
       rather than as boxes. Every other identity closes its cards
     - a diagonal hatch ground, where Depot rules horizontally and Angola
       vertically
     - condensed grotesque headings over a book serif body, inverting Depot
     - sources set in a hatched inset, so a source looks like a zone on the map
     - mono appears nowhere */

:root {
  --sand:  #EFEEEA;   /* page: cold paper */
  --paper: #FBFAF7;   /* cards */
  --cut:   #E4E3DD;   /* insets, sources, carousels */
  --ink:   #1B1D1F;
  --clay:  #5A5F63;   /* stage tags, quiet labels */
  --fade:  #83888C;
  /* border red for structure, steel blue for reward */
  --a1: #A32B23;  --a1-rgb: 163,43,35;
  --a2: #2E5F8A;  --a2-rgb: 46,95,138;
  --sans:  'Archivo Narrow', 'Archivo', 'Inter', system-ui, -apple-system, Arial, sans-serif;
  --serif: 'Source Serif 4', 'Charter', Georgia, serif;
  --mono:  var(--sans);
}

/* Ground: the diagonal hatch of a disputed zone on a period map. */
body {
  font-family: var(--serif) !important;
  background-image:
    repeating-linear-gradient(45deg,
      transparent 0 9px, rgba(27,29,31,0.034) 9px 10px) !important;

h1, h2, h3 {

}

/* Cards are bounded on two sides only. Territory, not a box. */

  border: 0 !important;
  border-top: 3px solid var(--a1) !important;
  border-left: 3px solid var(--a1) !important;

}

/* Labels: solid border-red plates in sentence case. No mono anywhere. */

}

.source {

/* Cover flourish: a boundary line, solid then broken, the way an atlas marks a

/* The engine reveals cover lines as inline spans on a 350ms stagger, so three

  max-width: 32rem;
}

// ---- identity of the five skill/tier labels ----
const CHIP = {
  Argue:{cls:"chip-argue"}, Evidence:{cls:"chip-evidence"}, Weigh:{cls:"chip-weigh"},
  Extract:{cls:"chip-extract"}, Interpret:{cls:"chip-interpret"}, Evaluate:{cls:"chip-evaluate"},
  instinct:{cls:"chip-instinct"}
};
// A lesson carries one spine or the other. Work it out on first use rather than at
// load time, so this never depends on FLOW having been evaluated yet.
const SOURCE_SPINE = ["Extract","Interpret","Evaluate"];
const ESSAY_SPINE  = ["Argue","Evidence","Weigh"];
let _spine = null;
function spine(){
  if(_spine) return _spine;
  const flow = (typeof FLOW !== "undefined" && Array.isArray(FLOW)) ? FLOW : [];
  _spine = flow.some(s => s && SOURCE_SPINE.includes(s.level)) ? SOURCE_SPINE : ESSAY_SPINE;
  return _spine;
}
// Never let an unknown label throw: an unrecognised spine word degrades to the neutral chip.
const chipCls = lvl => (CHIP[lvl] || CHIP.instinct).cls;

const stage = document.getElementById("stage");
const nav = document.getElementById("nav");
const topBar = document.getElementById("top-bar");
const nextBtn = document.getElementById("next-btn");
const backBtn = document.getElementById("back-btn");

const state = {
  idx: -1,                 // -1 = cover
  answers: {},             // qIdx -> chosen content index (mcq) or serialized (interactive)
  revealed: {},            // qIdx -> bool
  order: {},               // qIdx -> shuffled content-index array
  carRead: {},             // stepIdx -> Set of read card indices
  interState: {},          // qIdx -> working state for order/sort
  poppedBuild: {},         // qIdx -> bool (running-summary popup already shown)
};

const buildIds = FLOW.map((f,i)=>f.build?i:null).filter(i=>i!==null);
const assessedIds = FLOW.map((f,i)=>(f.type==="question"&&f.level)?i:null).filter(i=>i!==null);

function esc(s){
  return String(s).replace(/[&<>"]/g, (c, i, str) => {
    if(c === "&"){
      // leave a real HTML entity intact (e.g. &middot; &amp; &#8635;)
      const rest = str.slice(i);
      if(/^&(#\d+|#x[0-9a-fA-F]+|[a-zA-Z]+);/.test(rest)) return "&";
    }
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

// {optN} -> the letter option N carries after shuffle
function resolveOpts(text, order){
  if(!text) return text;
  return text.replace(/\{opt(\d+)\}/g,(m,n)=>{
    const p = order ? order.indexOf(parseInt(n,10)) : -1;
    return p>=0 ? String.fromCharCode(65+p) : m;
  });
}

// ============ COVER ============
function renderCover(){
  topBar.classList.add("hidden");
  nav.classList.add("hidden");
  const lines = (COVER.lines||[]).map(l=>`<span>${esc(l)} </span>`).join("");
  stage.innerHTML = `
    <div class="cover">
      <div class="cover-eyebrow">${COVER.eyebrow||""}</div>
      <h1 class="cover-title">${esc(COVER.title||"")}</h1>
      <div class="flourish"></div>
      <div class="cover-line" id="cover-line">${lines}</div>
      <button class="btn-begin" id="begin-btn">${COVER.begin||"Begin"} <span class="sa">&rarr;</span></button>
      ${COVER.time?`<div class="cover-time">${esc(COVER.time)}</div>`:""}
      ${COVER.skip!==false?`<button class="skip-link" id="skip-btn">Skip the opening if you have done this lesson before</button>`:""}
    </div>`;
  const spans = [...document.querySelectorAll("#cover-line span")];
  spans.forEach((s,i)=>setTimeout(()=>s.classList.add("vis"), 350*(i+1)));
  document.getElementById("begin-btn").addEventListener("click",()=>{ state.idx=0; render(); });
  const skip = document.getElementById("skip-btn");
  if(skip) skip.addEventListener("click",()=>{ state.idx = firstContentIdx(); render(); });
}
function firstContentIdx(){
  const i = FLOW.findIndex(f=>f.type==="content"||f.type==="carousel"||f.type==="stat");
  return i<0?0:i;
}

// ============ STORY HOOK ============
function renderStory(item){
  const lines = item.lines.map((l,i)=>{
    const last = i===item.lines.length-1 ? " last" : "";
    return `<div class="story-line${last}">${esc(l)}</div>`;
  }).join("");
  stage.innerHTML = `
    <div class="story">
      <div class="story-num">${esc(item.marker)}</div>
      <div class="story-unit">${esc(item.markerLabel||"")}</div>
      <div class="story-rule"></div>
      ${lines}
    </div>`;
  const els = [...stage.querySelectorAll(".story-line")];
  nextBtn.disabled = true;
  els.forEach((el,i)=>setTimeout(()=>{
    el.classList.add("vis");
    if(i===els.length-1) nextBtn.disabled = false;
  }, 650*(i+1)));
}

// ============ STATIC CONTENT ============
// Key-terms strip: label + one expandable chip per term.
function ktStrip(terms){
  if(!terms || !terms.length) return "";
  const chips = terms.map(t=>`<details class="kt-term"><summary>${esc(t.term)}</summary><div class="kt-def">${esc(t.def)}</div></details>`).join("");
  return `<div class="kt"><div class="kt-label">Key terms &middot; tap to open</div><div class="kt-row">${chips}</div></div>`;
}
function rememberBox(text){
  if(!text) return "";
  return `<details class="remember"><summary>Remember it like this</summary><div class="disc-body">${text}</div></details>`;
}

function renderContent(item){
  stage.innerHTML = `<div class="card">${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}${item.html}${rememberBox(item.remember)}${ktStrip(item.terms)}</div>`;
  bindToggles();
}

// ============ CAROUSEL ============
function renderCarousel(item){
  const cards = item.cards;
  if(!state.carRead[state.idx]) state.carRead[state.idx] = new Set([0]);
  const read = state.carRead[state.idx];
  const pos = state.interState[state.idx]?.pos || 0;
  read.add(pos);
  const c = cards[pos];
  const body = typeof c==="string" ? c : `<span class="cc-lead">${esc(c.lead)}</span>${esc(c.body)}`;
  const dots = cards.map((_,i)=>`<span class="car-dot ${read.has(i)?"read":""} ${i===pos?"here":""}"></span>`).join("");
  const allRead = read.size===cards.length;
  stage.innerHTML = `
    <div class="card">
      ${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}
      ${item.heading?`<h2>${esc(item.heading)}</h2>`:""}
      <div class="car-wrap">
        <div class="car-prompt" id="car-prompt">${allRead?`That is all ${cards.length}. Continue is unlocked.`:`Tap the arrows to read all ${cards.length}. Continue unlocks when you have.`}</div>
        <div class="car-frame"><div class="car-card">${body}</div></div>
        <div class="car-nav">
          <div class="car-dots">${dots}</div>
          <div class="car-count">${pos+1} / ${cards.length}</div>
          <div class="car-btns">
            <button class="car-btn" id="car-prev" ${pos===0?"disabled":""}>&larr;</button>
            <button class="car-btn" id="car-next" ${pos===cards.length-1?"disabled":""}>&rarr;</button>
          </div>
        </div>
      </div>
      ${ktStrip(item.terms)}
    </div>`;
  nextBtn.disabled = !allRead;
  const setPos=(p)=>{ state.interState[state.idx]={pos:p}; renderCarousel(item); };
  const pv=document.getElementById("car-prev"), nx=document.getElementById("car-next");
  if(pv) pv.addEventListener("click",()=>setPos(Math.max(0,pos-1)));
  if(nx) nx.addEventListener("click",()=>setPos(Math.min(cards.length-1,pos+1)));
}

// ============ STAT STRIP ============
function renderStat(item){
  const stats = item.stats.map(s=>`<div class="stat"><div class="stat-num">${esc(s.num)}</div><div class="stat-label">${esc(s.label)}</div></div>`).join("");
  stage.innerHTML = `
    <div class="card">
      ${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}
      ${item.heading?`<h2>${esc(item.heading)}</h2>`:""}
      ${item.lead?`<p>${item.lead}</p>`:""}
      <div class="stat-strip">${stats}</div>
      ${ktStrip(item.terms)}
    </div>`;
}


// Reopen strip: shown on a question that follows a source, so the learner
// never has to tap Back to reread the extract.
function sourcePeek(item){
  if(item.noSource) return "";
  const s = item.sourceRef || LAST_SOURCE;
  if(!s || !s.body) return "";
  return `<details class="srcpeek"><summary>
      <svg class="chev" width="11" height="13" viewBox="0 0 11 13" fill="none" aria-hidden="true"><path d="M2 1.5 L8.5 6.5 L2 11.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="peek-cue">Tap to read ${esc(s.label)} again<span class="peek-who">${esc(stripTags(s.attr)).slice(0,90)}</span></span>
    </summary><div class="peek-body">${s.body}</div></details>`;
}
function stripTags(h){ return String(h||"").replace(/<[^>]+>/g,""); }

// ============ SOURCE ============
// The most recent source rendered, so any later question can reopen it in place.
let LAST_SOURCE = null;

function renderSource(item){
  const s=item.source;
  LAST_SOURCE = { label: item.sourceLabel || item.tag || "the source", attr: s.attr, body: s.body };
  stage.innerHTML = `
    <div class="card">
      ${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}
      ${item.html||""}
      <div class="source">
        <div class="source-attr">${s.attr}</div>
        <div class="source-body">${s.body}</div>
        ${s.toggle?`<button class="toggle-btn" data-toggle>${s.toggleLabel||"What does this actually mean?"}</button><div class="toggle-body">${s.toggle}</div>`:""}
      </div>
      ${ktStrip(item.terms)}
    </div>`;
  bindToggles();
}

// ============ QUESTION (mcq / order / sort) ============
function renderQuestion(item){
  if(item.mode==="order") return renderOrder(item);
  if(item.mode==="sort") return renderSort(item);
  return renderMCQ(item);
}

function renderMCQ(item){
  const answered = state.revealed[state.idx];
  if(!state.order[state.idx]){
    const a=item.options.map((_,i)=>i);
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    state.order[state.idx]=a;
  }
  const order=state.order[state.idx];
  const chip = item.level ? `<span class="chip ${chipCls(item.level)}">${item.level}</span>` : `<span class="chip chip-instinct">Instinct</span>`;
  let opts="";
  order.forEach((orig,pos)=>{
    let cls="option", mark="";
    if(answered){
      if(orig===item.correct){ cls+=" correct"; mark=`<span class="opt-mark">&#10003;</span>`; }
      else if(orig===state.answers[state.idx]){ cls+=" wrong"; mark=`<span class="opt-mark">&#10007;</span>`; }
      else cls+=" dimmed";
    } else if(state.answers[state.idx]===orig){ cls+=" selected"; }
    opts+=`<button class="${cls}" data-orig="${orig}" ${answered?"disabled":""}><span class="opt-letter">${String.fromCharCode(65+pos)}</span><span class="opt-text">${item.options[orig]}</span>${mark}</button>`;
  });
  stage.innerHTML = `
    <div class="card">
      <div class="q-meta">${chip}${item.marks?`<span class="marks">${esc(item.marks)}</span>`:""}</div>
      ${sourcePeek(item)}
      <div class="q-text">${item.q}</div>
      <div class="options">${opts}</div>
      ${answered?`<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">${resolveOpts(item.explanation, order)}</div></div>`:""}
    </div>`;
  if(!answered){
    stage.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>{
      state.answers[state.idx]=parseInt(b.dataset.orig,10);
      state.revealed[state.idx]=true;
      render();
    }));
  }
  syncNav(true);
}

// order: tap to place into a numbered list, tap placed to remove; Check when all placed
function renderOrder(item){
  const answered = state.revealed[state.idx];
  const st = state.interState[state.idx] || (state.interState[state.idx]={placed:[]});
  const placed = st.placed;                       // array of content indices in chosen order
  const remaining = item.items.map((_,i)=>i).filter(i=>!placed.includes(i));
  let placedHtml = placed.map((ci,pos)=>{
    let cls="inter-item inter-placed";
    if(answered){ cls = "inter-item "+(ci===item.answer[pos]?"ok":"no"); }
    return `<button class="${cls}" data-placed="${ci}" ${answered?"disabled":""}><span class="rank">${pos+1}</span><span>${esc(item.items[ci])}</span></button>`;
  }).join("");
  let poolHtml = remaining.map(ci=>`<button class="inter-item" data-pool="${ci}"><span class="rank">&bull;</span><span>${esc(item.items[ci])}</span></button>`).join("");
  stage.innerHTML = `
    <div class="card">
      <div class="q-meta"><span class="chip ${item.level?chipCls(item.level):"chip-instinct"}">${item.level||"Instinct"}</span>${item.marks?`<span class="marks">${esc(item.marks)}</span>`:""}</div>
      ${sourcePeek(item)}
      <div class="q-text">${item.q}</div>
      <div class="inter">
        <div class="inter-pool" id="placed">${placedHtml||`<div style="color:var(--fade);font-size:0.9rem;padding:0.4rem 0;">Tap an event below to start putting them in order.</div>`}</div>
        ${remaining.length?`<div style="height:1px;background:rgba(27,42,51,0.14);margin:0.9rem 0;"></div><div class="inter-pool" id="pool">${poolHtml}</div>`:""}
      </div>
      ${answered?`<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">${resolveOpts(item.explanation,null)}</div></div>`:""}
    </div>`;
  if(!answered){
    stage.querySelectorAll("[data-pool]").forEach(b=>b.addEventListener("click",()=>{ placed.push(parseInt(b.dataset.pool,10)); renderOrder(item); }));
    stage.querySelectorAll("[data-placed]").forEach(b=>b.addEventListener("click",()=>{ const ci=parseInt(b.dataset.placed,10); st.placed=placed.filter(x=>x!==ci); renderOrder(item); }));
  }
  const allPlaced = placed.length===item.items.length;
  syncNavInteractive(allPlaced, answered, ()=>{
    state.answers[state.idx]=placed.slice();
    state.revealed[state.idx]=true; render();
  });
}

// sort: two columns, tap an item's column button to place, tap placed to remove
function renderSort(item){
  const answered = state.revealed[state.idx];
  const st = state.interState[state.idx] || (state.interState[state.idx]={col:{}});
  const col = st.col;                              // content index -> 0/1
  const unplaced = item.items.map((_,i)=>i).filter(i=>!(i in col));
  const colCards = (which)=>item.items.map((it,ci)=>{
    if(col[ci]!==which) return "";
    let cls="inter-item inter-placed";
    if(answered) cls="inter-item "+(item.answer[ci]===which?"ok":"no");
    return `<button class="${cls}" data-un="${ci}" ${answered?"disabled":""}><span>${esc(it)}</span></button>`;
  }).join("");
  const pool = unplaced.map(ci=>`
    <div class="inter-item" style="flex-direction:column;align-items:stretch;cursor:default;">
      <span>${esc(item.items[ci])}</span>
      <div class="sort-btns">
        <button class="sort-place" data-place="${ci}" data-col="0">${esc(item.cols[0])}</button>
        <button class="sort-place" data-place="${ci}" data-col="1">${esc(item.cols[1])}</button>
      </div>
    </div>`).join("");
  stage.innerHTML = `
    <div class="card">
      <div class="q-meta"><span class="chip ${item.level?chipCls(item.level):"chip-instinct"}">${item.level||"Instinct"}</span>${item.marks?`<span class="marks">${esc(item.marks)}</span>`:""}</div>
      ${sourcePeek(item)}
      <div class="q-text">${item.q}</div>
      <div class="inter">
        <div class="sort-cols">
          <div class="sort-col"><h4>${esc(item.cols[0])}</h4>${colCards(0)}</div>
          <div class="sort-col"><h4>${esc(item.cols[1])}</h4>${colCards(1)}</div>
        </div>
        ${unplaced.length?`<div style="height:1px;background:rgba(27,42,51,0.14);margin:0.9rem 0;"></div><div class="inter-pool">${pool}</div>`:""}
      </div>
      ${answered?`<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">${resolveOpts(item.explanation,null)}</div></div>`:""}
    </div>`;
  if(!answered){
    stage.querySelectorAll("[data-place]").forEach(b=>b.addEventListener("click",()=>{ col[parseInt(b.dataset.place,10)]=parseInt(b.dataset.col,10); renderSort(item); }));
    stage.querySelectorAll("[data-un]").forEach(b=>b.addEventListener("click",()=>{ delete col[parseInt(b.dataset.un,10)]; renderSort(item); }));
  }
  const allPlaced = unplaced.length===0;
  syncNavInteractive(allPlaced, answered, ()=>{
    state.answers[state.idx]=Object.assign({},col);
    state.revealed[state.idx]=true; render();
  });
}

// ============ RUNNING SUMMARY (own screen) ============
function renderRunsum(item){
  const parts = buildIds.filter(i=>i<=state.idx && state.revealed[i]).map(i=>FLOW[i].part);
  const freshIdx = parts.length-1;
  const lis = parts.map((p,i)=>`<li class="${i===freshIdx?"fresh":""}">${esc(p)}</li>`).join("");
  stage.innerHTML = `
    <div class="card">
      <div class="stage-tag">${esc(item.tag||"Your running summary")}</div>
      ${item.heading?`<h2>${esc(item.heading)}</h2>`:""}
      ${item.html?item.html:""}
      <div class="runsum"><div class="runsum-label">${esc(item.label||"Your running summary")}</div><ol>${lis}</ol></div>
      ${item.outro?`<p class="runsum-outro">${item.outro}</p>`:""}
    </div>`;
}

// ============ POPUP after a build question ============
function showBuildPop(part, label){
  const back=document.createElement("div");
  back.className="pop-back";
  back.innerHTML=`<div class="pop"><div class="pop-label">${esc(label||"The line this lesson argues")}</div><div class="pop-text">${esc(part)}</div><button class="pop-btn" id="pop-ok">Got it</button></div>`;
  document.body.appendChild(back);
  document.getElementById("pop-ok").addEventListener("click",()=>back.remove());
}

// ============ NAV ============
function syncNav(isQuestion){
  nav.classList.remove("hidden");
  backBtn.disabled=false;
  backBtn.innerHTML = state.idx===0 ? "&larr; Back to the start" : "&larr; Back";
  nextBtn.style.display="";
  nextBtn.disabled = isQuestion ? !state.revealed[state.idx] : false;
  nextBtn.innerHTML = state.idx===FLOW.length-1 ? "See results &rarr;" : "Continue &rarr;";
}
// interactive items: replace Continue with a Check button until answered
function syncNavInteractive(canCheck, answered, onCheck){
  nav.classList.remove("hidden");
  backBtn.disabled=false;
  backBtn.innerHTML = state.idx===0 ? "&larr; Back to the start" : "&larr; Back";
  if(answered){
    nextBtn.style.display="";
    nextBtn.disabled=false;
    nextBtn.innerHTML = state.idx===FLOW.length-1 ? "See results &rarr;" : "Continue &rarr;";
    nextBtn.onclick = defaultNext;
  } else {
    nextBtn.style.display="";
    nextBtn.disabled=!canCheck;
    nextBtn.innerHTML="Check &rarr;";
    nextBtn.onclick = ()=>{ onCheck(); };
  }
}

function defaultNext(){
  // fire the running-summary popup when leaving a build question
  const cur=FLOW[state.idx];
  if(cur && cur.build && state.revealed[state.idx] && !state.poppedBuild[state.idx]){
    state.poppedBuild[state.idx]=true;
    showBuildPop(cur.part, cur.buildLabel);
  }
  if(state.idx<FLOW.length-1){ state.idx++; render(); } else showResults();
}

nextBtn.onclick = defaultNext;
backBtn.addEventListener("click",()=>{
  if(state.idx<=0){ state.idx=-1; renderCover(); }
  else { state.idx--; render(); }
});

// ============ RENDER DISPATCH ============
function render(){
  window.scrollTo({top:0,behavior:"instant"});
  if(state.idx===-1){ renderCover(); return; }
  topBar.classList.remove("hidden");
  document.getElementById("step-count").textContent=`Step ${state.idx+1} of ${FLOW.length}`;
  document.getElementById("fill").style.width=((state.idx+1)/FLOW.length*100)+"%";
  const item=FLOW[state.idx];
  nextBtn.onclick = defaultNext;
  switch(item.type){
    case "story": renderStory(item); syncNav(false); break;
    case "carousel": renderCarousel(item); /* nav handled inside */ syncNavCarousel(); break;
    case "stat": renderStat(item); syncNav(false); break;
    case "source": renderSource(item); syncNav(false); break;
    case "question": renderQuestion(item); break;
    case "runsum": renderRunsum(item); syncNav(false); break;
    default: renderContent(item); syncNav(false);
  }
}
function syncNavCarousel(){
  nav.classList.remove("hidden");
  backBtn.disabled=false;
  backBtn.innerHTML = state.idx===0 ? "&larr; Back to the start" : "&larr; Back";
  nextBtn.style.display="";
  nextBtn.innerHTML = state.idx===FLOW.length-1 ? "See results &rarr;" : "Continue &rarr;";
  // disabled state already set inside renderCarousel
}

function bindToggles(){
  stage.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>{
    b.nextElementSibling.classList.toggle("open");
  }));
}

// ============ RESULTS ============
function showResults(){
  topBar.classList.add("hidden");
  nav.classList.add("hidden");
  let correct=0;
  assessedIds.forEach(i=>{ if(isRight(i)) correct++; });
  const total=assessedIds.length;
  const pct = total?Math.round(correct/total*100):0;
  let band="", desc="";
  if(pct>=85){ band="Excellent"; desc=RESULTS.bands.excellent; }
  else if(pct>=70){ band="Strong"; desc=RESULTS.bands.strong; }
  else if(pct>=55){ band="Solid"; desc=RESULTS.bands.solid; }
  else if(pct>=40){ band="Patchy"; desc=RESULTS.bands.patchy; }
  else { band="Start again"; desc=RESULTS.bands.start; }
  const rows=spine().map(sp=>{
    const ids=assessedIds.filter(i=>FLOW[i].level===sp);
    if(!ids.length) return "";
    const g=ids.filter(i=>isRight(i)).length;
    const p=Math.round(g/ids.length*100);
    return `<div class="bd-row"><div class="bd-name">${sp}</div><div class="bd-bar"><div class="bd-fill" style="width:${p}%"></div></div><div class="bd-score">${g}/${ids.length}</div></div>`;
  }).join("");
  const parts=buildIds.filter(i=>state.revealed[i]).map(i=>FLOW[i].part);
  const runsum = parts.length?`<div class="breakdown"><div class="breakdown-label">Your running summary</div><ol style="margin:0;padding-left:1.3rem;">${parts.map(p=>`<li style="font-size:0.98rem;line-height:1.62;margin-bottom:0.6rem;">${esc(p)}</li>`).join("")}</ol></div>`:"";
  stage.innerHTML = `
    <div class="results-head">
      <div class="results-eyebrow">${RESULTS.eyebrow||"Lesson report"}</div>
      <h1 class="results-title">${esc(RESULTS.title||"Where you stand")}</h1>
    </div>
    <div class="score-row">
      <div class="score-block"><div class="score-num">${correct}<span class="score-den">/${total}</span></div><div class="score-label">Correct</div></div>
      <div class="score-block"><div class="score-num">${pct}<span class="score-den">%</span></div><div class="score-label">Accuracy</div></div>
      <div class="score-block"><div class="score-word">${band}</div><div class="score-label">Band</div></div>
    </div>
    <div class="grade-desc">${desc}</div>
    <div class="breakdown"><div class="breakdown-label">By skill</div>${rows}</div>
    ${runsum}
    <div class="results-actions">
      <button class="btn-secondary" id="restart-btn">Restart lesson</button>
      <button class="btn-primary" id="finish-btn">Finish &rarr;</button>
    </div>
    ${RESULTS.footer?`<div style="text-align:center;margin-top:1.1rem;font-size:0.92rem;color:var(--fade);">${esc(RESULTS.footer)}</div>`:""}`;
  document.getElementById("restart-btn").addEventListener("click",()=>{
    state.idx=-1; state.answers={}; state.revealed={}; state.order={}; state.carRead={}; state.interState={}; state.poppedBuild={};
    renderCover();
  });
  document.getElementById("finish-btn").addEventListener("click",()=>{
    const back=document.createElement("div");
    back.className="pop-back";
    const D = RESULTS.done||{};
    back.innerHTML=`<div class="pop"><div class="pop-label">${esc(D.label||"Lesson complete")}</div>${D.title?`<h3 style="margin:.4rem 0 .2rem;font-size:1.05rem;">${esc(D.title)}</h3>`:""}<div class="pop-text">${esc(D.text||"Tap Done to continue.")}</div><button class="pop-btn" id="fin-ok">Got it</button></div>`;
    document.body.appendChild(back);
    document.getElementById("fin-ok").addEventListener("click",()=>back.remove());
  });
}

function isRight(i){
  const item=FLOW[i]; const ans=state.answers[i];
  if(ans===undefined) return false;
  if(item.mode==="order") return JSON.stringify(ans)===JSON.stringify(item.answer);
  if(item.mode==="sort"){ return item.items.every((_,ci)=>ans[ci]===item.answer[ci]); }
  return ans===item.correct;
}

renderCover();
})();


/* ---- MODE TOGGLE ---------------------------------------------------------
   Injects its own button so there is no stray markup, and lives inside the
   single script block so a first-to-last script extraction still parses. */
(function(){
  var NATIVE = "light";
  try{ if(localStorage.getItem("kula-mode")==="alt"){ document.body.classList.add("alt"); } }catch(e){}
  var SUN='<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>';
  var MOON='<path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/>';
  var b=document.getElementById("mode-toggle");
  if(!b){
    b=document.createElement("button");
    b.className="mode-toggle"; b.id="mode-toggle"; b.type="button";
    b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" id="mode-icon"></svg><span id="mode-label"></span>';
    document.body.appendChild(b);
  }
  var lab=document.getElementById("mode-label"), ic=document.getElementById("mode-icon");
  function paint(){
    var onAlt=document.body.classList.contains("alt");
    var showing = onAlt ? (NATIVE==="dark" ? "light" : "dark") : NATIVE;
    var offering = showing==="dark" ? "light" : "dark";
    lab.textContent = offering==="light" ? "Light Mode" : "Dark Mode";
    ic.innerHTML = offering==="light" ? SUN : MOON;
    b.setAttribute("aria-pressed", onAlt ? "true" : "false");
    b.setAttribute("aria-label", "Switch to " + offering + " mode");
  }
  b.addEventListener("click",function(){
    var onAlt=document.body.classList.toggle("alt");
    try{ localStorage.setItem("kula-mode", onAlt ? "alt" : "native"); }catch(e){}
    paint();
  });
  paint();
})();
</script>
